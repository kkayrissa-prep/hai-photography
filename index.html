<script>
window.addEventListener("load", () => {
  const bgPhotos = document.querySelectorAll('.bg-photo');

  const usedPositions = [];

  bgPhotos.forEach((img) => {
    let top, left;

    let tries = 0;
    do {
      top = Math.random() * (75 - 25) + 25;   // 25% to 75%
      left = Math.random() * (80 - 10) + 10;  // 10% to 80%

      tries++;
      if (tries > 40) break;
    } while (
      usedPositions.some(pos =>
        Math.abs(pos.top - top) < 10 &&
        Math.abs(pos.left - left) < 10
      )
    );

    usedPositions.push({ top, left });

    const rotation = (Math.random() * 30) - 15;

    img.style.top = `${top}%`;
    img.style.left = `${left}%`;
    img.style.transform = `rotate(${rotation}deg)`;
  });
});
</script>
