<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<div id="bg-photos">
  <img class="bg-photo" src="assets/prom/IMG_9006.JPG" alt="">
  <img class="bg-photo" src="assets/prom/IMG_9011.JPG" alt="">
  <img class="bg-photo" src="assets/prom/IMG_9024.JPG" alt="">
  <img class="bg-photo" src="assets/prom/IMG_9228.JPG" alt="">
  <img class="bg-photo" src="assets/prom/IMG_9288.JPG" alt="">
</div>

<header>
  <div class="logo">Hai Photography</div>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="gallery.html">Gallery</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</header>

<main class="landing">
  <h1>Hai Photography</h1>
  <p>Cary, NC — Headshots & Event Photography</p>

  <div class="landing-buttons">
    <a href="gallery.html" class="btn">View Gallery</a>
    <a href="contact.html" class="btn">Contact Info</a>
  </div>
</main>

<script>
// Randomized background photos with spacing, no overlap, no header collision
const bgPhotos = document.querySelectorAll('.bg-photo');

const usedPositions = [];

bgPhotos.forEach((img) => {
  let top, left;

  // Try random positions until one doesn't overlap previous photos
  let tries = 0;
  do {
    top = Math.random() * (78 - 22) + 22;   // safe zone: 22% to 78%
    left = Math.random() * (80 - 10) + 10;  // safe zone: 10% to 80%

    tries++;
    if (tries > 50) break; // fail-safe
  } while (
    usedPositions.some(pos =>
      Math.abs(pos.top - top) < 12 && Math.abs(pos.left - left) < 12
    )
  );

  usedPositions.push({ top, left });

  const rotation = (Math.random() * 30) - 15; // -15° to +15°

  img.style.top = `${top}%`;
  img.style.left = `${left}%`;
  img.style.transform = `rotate(${rotation}deg)`;
});

</script>

</body>
</html>
