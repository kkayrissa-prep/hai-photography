<!DOCTYPE html>
<html lang="en">
<head>

<body>

<div id="bg-photos">
  <img class="bg-photo" src="assets/prom/IMG_9006.JPG" alt="">
  <img class="bg-photo" src="assets/prom/IMG_9011.JPG" alt="">
  <img class="bg-photo" src="assets/prom/IMG_9024.JPG" alt="">
  <img class="bg-photo" src="assets/prom/IMG_9228.JPG" alt="">
  <img class="bg-photo" src="assets/prom/IMG_9288.JPG" alt="">
</div>

<header>
  <div class="logo">Hai Photography</div>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="gallery.html">Gallery</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</header>

<main class="landing">
  <h1>Hai Photography</h1>
  <p>Cary, NC — Headshots & Event Photography</p>

  <div class="landing-buttons">
    <a href="gallery.html" class="btn">View Gallery</a>
    <a href="contact.html" class="btn">Contact Info</a>
  </div>
</main>

<script>
  // Spread background photos, avoid header, avoid overlap, limit rotation
const bgPhotos = document.querySelectorAll('.bg-photo');

bgPhotos.forEach((img, index) => {
  // Define safe zones
  const safeTopMin = 18;   // no photos above 18% (keeps them out of header)
  const safeTopMax = 85;   // bottom limit
  const safeLeftMin = 5;
  const safeLeftMax = 90;

  // Create a grid so photos don't overlap
  const cols = 3;
  const rows = Math.ceil(bgPhotos.length / cols);

  const col = index % cols;
  const row = Math.floor(index / cols);

  // Spread evenly
  const top = safeTopMin + row * ((safeTopMax - safeTopMin) / rows);
  const left = safeLeftMin + col * ((safeLeftMax - safeLeftMin) / (cols - 1));

  // Limit rotation
  const rotation = (Math.random() * 30) - 15; // -15 to +15 degrees

  img.style.top = `${top}%`;
  img.style.left = `${left}%`;
  img.style.transform = `rotate(${rotation}deg)`;
});

</script>

</body>
</html>
