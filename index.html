<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hai Photography</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<header>
  <div class="logo">Hai Photography</div>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="gallery.html">Gallery</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</header>

<main class="landing">

  <div id="bg-photos"></div>

  <h1>Hai Photography</h1>
  <p>Cary, NC — Headshots & Event Photography</p>

  <div class="landing-buttons">
    <a href="gallery.html" class="btn">View Gallery</a>
    <a href="contact.html" class="btn">Contact Info</a>
  </div>

</main>

<script>
  const photoPaths = [
    "assets/prom/IMG_9006.JPG",
    "assets/prom/IMG_9011.JPG",
    "assets/prom/IMG_9024.JPG",
    "assets/prom/IMG_9026.JPG",
    "assets/prom/IMG_9032.JPG",
    "assets/prom/IMG_9228.JPG",
    "assets/prom/IMG_9288.JPG",
    "assets/prom/IMG_9298.JPG",
    "assets/prom/IMG_9360.JPG",
    "assets/prom/IMG_9546.JPG",
    "assets/prom/IMG_9810.JPG",
    "assets/prom/IMG_9919.JPG",
    "assets/prom/IMG_9939.JPG",
    "assets/prom/IMG_9943.JPG"
  ];

  const bgContainer = document.getElementById("bg-photos");

  const randomPhotos = photoPaths
    .sort(() => Math.random() - 0.5)
    .slice(0, 5);

  randomPhotos.forEach(src => {
    const img = document.createElement("img");
    img.src = src;
    img.classList.add("bg-photo");

    const size = Math.random() * 200 + 150;
    img.style.width = size + "px";

    img.style.top = Math.random() * 80 + "%";
    img.style.left = Math.random() * 80 + "%";

    img.style.transform = `rotate(${Math.random() * 40 - 20}deg)`;

    img.onerror = () => img.remove();

    bgContainer.appendChild(img);
  });
</script>

</body>
</html>
