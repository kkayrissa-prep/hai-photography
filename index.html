<script>
  // Spread background photos, limit rotation to ±15°
  const bgPhotos = document.querySelectorAll('.bg-photo');
  bgPhotos.forEach((img, index) => {
    const cols = 3;
    const rows = Math.ceil(bgPhotos.length / cols);
    const col = index % cols;
    const row = Math.floor(index / cols);

    const top = 10 + row * (70 / rows);   // spread vertically
    const left = 5 + col * (90 / (cols - 1)); // spread horizontally

    const rotation = (Math.random() * 30) - 15; // -15 to +15

    img.style.top = top + '%';
    img.style.left = left + '%';
    img.style.transform = `rotate(${rotation}deg)`;
  });
</script>

</body>
