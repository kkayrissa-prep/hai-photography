<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery – Hai Photography</title>
  <link rel="stylesheet" href="css/styles.css">

  <!-- Disable right-click + copying ONLY on gallery images -->
  <style>
    img.nocopy {
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }
  </style>

  <script>
    // Disable right-click
    document.addEventListener('contextmenu', event => event.preventDefault());
  </script>
</head>

<body>

<header>
  <div class="logo">Hai Photography</div>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="gallery.html">Gallery</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</header>

<div class="gallery-page">

  <!-- HEADSHOTS DROPDOWN -->
  <details class="dropdown">
    <summary>Headshots</summary>
    <div class="gallery-grid">
      <!-- Placeholder images until you upload real headshots -->
      <img class="nocopy" src="assets/headshots/photo1.jpg" alt="Headshot 1">
      <img class="nocopy" src="assets/headshots/photo2.jpg" alt="Headshot 2">
      <img class="nocopy" src="assets/headshots/photo3.jpg" alt="Headshot 3">
    </div>
  </details>

  <!-- ROBOTS DROPDOWN -->
  <details class="dropdown">
    <summary>Robots</summary>
    <div class="gallery-grid">
      <!-- Placeholder images until you upload robot photos -->
      <img class="nocopy" src="assets/robots/robot1.jpg" alt="Robot 1">
      <img class="nocopy" src="assets/robots/robot2.jpg" alt="Robot 2">
      <img class="nocopy" src="assets/robots/robot3.jpg" alt="Robot 3">
    </div>
  </details>

  <!-- PROM PHOTOS DROPDOWN -->
  <details class="dropdown" open>
    <summary>Prom Photos</summary>
    <div class="gallery-grid">
      <img class="nocopy" src="assets/prom/IMG_9006.JPG" alt="Prom photo">
      <img class="nocopy" src="assets/prom/IMG_9011.JPG" alt="Prom photo">
      <img class="nocopy" src="assets/prom/IMG_9024.JPG" alt="Prom photo">
      <img class="nocopy" src="assets/prom/IMG_9026.JPG" alt="Prom photo">
      <img class="nocopy" src="assets/prom/IMG_9032.JPG" alt="Prom photo">
      <img class="nocopy" src="assets/prom/IMG_9228.jpg" alt="Prom photo">
      <img class="nocopy" src="assets/prom/IMG_9288.JPG" alt="Prom photo">
      <img class="nocopy" src="assets/prom/IMG_9298.JPG" alt="Prom photo">
      <img class="nocopy" src="assets/prom/IMG_9360.JPG" alt="Prom photo">
      <img class="nocopy" src="assets/prom/IMG_9546.JPG" alt="Prom photo">
      <img class="nocopy" src="assets/prom/IMG_9810.JPG" alt="Prom photo">
      <img class="nocopy" src="assets/prom/IMG_9919.JPG" alt="Prom photo">
      <img class="nocopy" src="assets/prom/IMG_9939.JPG" alt="Prom photo">
      <img class="nocopy" src="assets/prom/IMG_9943.JPG" alt="Prom photo">
    </div>
  </details>

</div>

</body>
</html>
