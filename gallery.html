<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery – Hai Photography</title>
  <link rel="stylesheet" href="css/styles.css">

  <!-- Disable right-click + copying ONLY on gallery images -->
  <style>
    img.nocopy {
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }
  </style>

  <script>
    // Disable right-click
    document.addEventListener('contextmenu', event => event.preventDefault());
  </script>
</head>

<body>

<header>
  <div class="logo">Hai Photography</div>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="gallery.html">Gallery</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</header>

<div class="gallery-page">

  <!-- HEADSHOTS (EMPTY) -->
  <details class="dropdown">
    <summary>Headshots</summary>
    <div class="gallery-grid">
      <!-- No photos yet -->
    </div>
  </details>

  <!-- ROBOTS (EMPTY) -->
  <details class="dropdown">
    <summary>Robots</summary>
    <div class="gallery-grid">
      <!-- No photos yet -->
    </div>
  </details>

  <!-- PROM PHOTOS -->
  <details class="dropdown" open>
    <summary>Prom Photos</summary>
    <div class="gallery-grid">
      <img class="gallery-img nocopy" src="assets/prom/IMG_9006.JPG">
      <img class="gallery-img nocopy" src="assets/prom/IMG_9011.JPG">
      <img class="gallery-img nocopy" src="assets/prom/IMG_9024.JPG">
      <img class="gallery-img nocopy" src="assets/prom/IMG_9026.JPG">
      <img class="gallery-img nocopy" src="assets/prom/IMG_9032.JPG">
      <img class="gallery-img nocopy" src="assets/prom/IMG_9228.JPG">
      <img class="gallery-img nocopy" src="assets/prom/IMG_9288.JPG">
      <img class="gallery-img nocopy" src="assets/prom/IMG_9298.JPG">
      <img class="gallery-img nocopy" src="assets/prom/IMG_9360.JPG">
      <img class="gallery-img nocopy" src="assets/prom/IMG_9546.JPG">
      <img class="gallery-img nocopy" src="assets/prom/IMG_9810.JPG">
      <img class="gallery-img nocopy" src="assets/prom/IMG_9919.JPG">
      <img class="gallery-img nocopy" src="assets/prom/IMG_9939.JPG">
      <img class="gallery-img nocopy" src="assets/prom/IMG_9943.JPG">
    </div>
  </details>

</div>

<!-- LIGHTBOX POPUP -->
<div id="lightbox" class="lightbox">
  <img id="lightbox-img" src="">
  <div class="arrow left" id="arrow-left">&#10094;</div>
  <div class="arrow right" id="arrow-right">&#10095;</div>
</div>

<script>
  const images = Array.from(document.querySelectorAll(".gallery-img"));
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightbox-img");
  const arrowLeft = document.getElementById("arrow-left");
  const arrowRight = document.getElementById("arrow-right");

  let currentIndex = 0;

  // Open lightbox
  images.forEach((img, index) => {
    img.addEventListener("click", () => {
      currentIndex = index;
      lightboxImg.src = images[currentIndex].src;
      lightbox.classList.add("active");
    });
  });

  // Close lightbox
  lightbox.addEventListener("click", (e) => {
    if (e.target === lightbox) {
      lightbox.classList.remove("active");
    }
  });

  // Arrows
  arrowLeft.addEventListener("click", (e) => {
    e.stopPropagation();
    currentIndex = (currentIndex - 1 + images.length) % images.length;
    lightboxImg.src = images[currentIndex].src;
  });

  arrowRight.addEventListener("click", (e) => {
    e.stopPropagation();
    currentIndex = (currentIndex + 1) % images.length;
    lightboxImg.src = images[currentIndex].src;
  });

  // Swipe navigation
  let startX = 0;

  lightbox.addEventListener("touchstart", (e) => {
    startX = e.touches[0].clientX;
  });

  lightbox.addEventListener("touchend", (e) => {
    let endX = e.changedTouches[0].clientX;
    let diff = startX - endX;

    if (diff > 50) {
      currentIndex = (currentIndex + 1) % images.length;
      lightboxImg.src = images[currentIndex].src;
    } else if (diff < -50) {
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      lightboxImg.src = images[currentIndex].src;
    }
  });

  // Zoom (tap to toggle)
  let zoomed = false;

  lightboxImg.addEventListener("click", (e) => {
    e.stopPropagation();
    zoomed = !zoomed;
    lightboxImg.style.transform = zoomed ? "scale(2)" : "scale(1)";
    lightboxImg.style.cursor = zoomed ? "zoom-out" : "zoom-in";
  });
</script>

</body>
</html>
