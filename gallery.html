<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery – Hai Photography</title>
  <link rel="stylesheet" href="css/styles.css">

  <!-- Disable right-click + copying ONLY on gallery images -->
  <style>
    img.nocopy {
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }
  </style>

  <script>
    // Disable right-click
    document.addEventListener('contextmenu', event => event.preventDefault());
  </script>
</head>

<body>

<header>
  <div class="logo">Hai Photography</div>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="gallery.html">Gallery</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</header>

<div class="gallery-page">

  <!-- HEADSHOTS -->
  <details class="dropdown">
    <summary>Headshots</summary>
    <div class="gallery-grid">
      <img class="gallery-img nocopy" src="assets/headshots/photo1.jpg">
      <img class="gallery-img nocopy" src="assets/headshots/photo2.jpg">
      <img class="gallery-img nocopy" src="assets/headshots/photo3.jpg">
    </div>
  </details>

  <!-- ROBOTS -->
  <details class="dropdown">
    <summary>Robots</summary>
    <div class="gallery-grid">
      <img class="gallery-img nocopy" src="assets/robots/robot1.jpg">
      <img class="gallery-img nocopy" src="assets/robots/robot2.jpg">
      <img class="gallery-img nocopy" src="assets/robots/robot3.jpg">
    </div>
  </details>

  <!-- PROM PHOTOS -->
  <details class="dropdown" open>
    <summary>Prom Photos</summary>
    <div class="gallery-grid">
      <img class="gallery-img nocopy" src="assets/prom/IMG_9006.JPG">
      <img class="gallery-img nocopy" src="assets/prom/IMG_9011.JPG">
      <img class="gallery-img nocopy" src="assets/prom/IMG_9024.JPG">
      <img class="gallery-img nocopy" src="assets/prom/IMG_9026.JPG">
      <img class="gallery-img nocopy" src="assets/prom/IMG_9032.JPG">
      <img class="gallery-img nocopy" src="assets/prom/IMG_9228.jpg">
      <img class="gallery-img nocopy" src="assets/prom/IMG_9288.JPG">
      <img class="gallery-img nocopy" src="assets/prom/IMG_9298.JPG">
      <img class="gallery-img nocopy" src="assets/prom/IMG_9360.JPG">
      <img class="gallery-img nocopy" src="assets/prom/IMG_9546.JPG">
      <img class="gallery-img nocopy" src="assets/prom/IMG_9810.JPG">
      <img class="gallery-img nocopy" src="assets/prom/IMG_9919.JPG">
      <img class="gallery-img nocopy" src="assets/prom/IMG_9939.JPG">
      <img class="gallery-img nocopy" src="assets/prom/IMG_9943.JPG">
    </div>
  </details>

</div>

<!-- LIGHTBOX POPUP -->
<div id="lightbox" class="lightbox">
  <img id="lightbox-img" src="">
</div>

<script>
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightbox-img");

  document.querySelectorAll(".gallery-img").forEach(img => {
    img.addEventListener("click", () => {
      lightboxImg.src = img.src;
      lightbox.classList.add("active");
    });
  });

  lightbox.addEventListener("click", () => {
    lightbox.classList.remove("active");
  });
</script>

</body>
</html>
